# Seletores CSS dos sites. Quando um site mudar o layout, ajuste aqui, sem tocar no código.

[decolar]
result = "div.results-cluster-container"
name = ".accommodation-name.-eva-3-ellipsis"
rating = ".tooltip-text.-eva-3-mb-xsm"
payment_conditions = ".eva-3-p.-eva-3-mt-xsm"
people = ".eva-3-p.-eva-3-tc-gray-0.first-message"
price = ".main-value"

[google_hotels]
check_in_input = "input[aria-label='Fazer check-in']"
check_out_input = "input[aria-label='Fazer check-out']"
hotel_card = "div.pjDrrc"
hotel_link = ".aS3xV.lRagtb.xl0RMe"
hotel_name = ".BgYkof.ogfYpf.ykx2he"
hotel_rating = ".KFi5wf.lA0BZ"
prices_tab = "#prices"
offer = "div.ADs2Tc"
offer_price = ".nDkDDb"
offer_site = ".NiGhzc"
offer_link = ".hUGVEe.cTvP0c"
address = "div.K4nuhf .CFH2De"
reviews_tab = "#reviews"
reviews_block = "span#reviews:has(.FBsWCd)"
reviews_summary = "[aria-label*='estrelas em']"
topic_button = "button:has(.m1GHmf)"
topic_label = ".m1GHmf"
topic_positive_class = "HPIhNd"
topic_negative_class = "lErJIb"
other_site = ".TL1fMd:has(.xtsqwb)"
other_site_name = ".xtsqwb"
other_site_score = ".s97yQ"

[google_maps]
distance = ".ivN21e.tUEI8e.fontBodyMedium"

[smiles]
url = "https://www.smiles.com.br/promocao"
# Trecho da URL do JSON que a página baixa para montar os cartões de promoção.
promotions_response = "/structured-content-folders/8372340/structured-contents"

[pontos_pra_voar]
posts_api = "https://pontospravoar.com/wp-json/wp/v2/posts"
# Título do resumo diário; também é o termo usado na busca de posts.
title_prefix = "Radar PPV"

[livelo]
# Páginas Next.js: os dados vêm em <script id="__NEXT_DATA__">.
partners_url = "https://www.livelo.com.br/juntar-pontos/todos-os-parceiros"
offers_url = "https://www.livelo.com.br/ofertas"

[esfera]
# API que a página https://www.esfera.com.vc/esfera-lp_campanhas usa para listar as campanhas.
campaigns_api = "https://apigw.esfera.com.vc/bff-campaign/ehis/campaign"

# Feeds RSS dos blogs de milhas. Sem validade no feed: entram as notícias dos últimos
# max_age_days dias que citam um programa conhecido (veja PROGRAMS em sources/feeds.py).
# Os feeds por programa cobrem LATAM Pass e Azul, cujos sites bloqueiam o robô.
# Uma notícia que aparece em dois feeds do mesmo blog entra uma vez.
[[feeds]]
name = "Passageiro de Primeira"
urls = ["https://passageirodeprimeira.com/categorias/promocoes/feed/"]

[[feeds]]
name = "Pontos pra Voar"
urls = [
    "https://pontospravoar.com/category/promocoes/feed/",
    "https://pontospravoar.com/category/programas-de-fidelidade/latam-pass/feed/",
    "https://pontospravoar.com/category/programas-de-fidelidade/azul-fidelidade/feed/",
]
# Sem filtro de categoria: posts das subcategorias (LATAM Pass, Azul Fidelidade) nem sempre listam a
# categoria-pai. Notícias fora do tema, como cupons do Mercado Livre, já saem por não citarem um programa.

[[feeds]]
name = "Melhores Cartões"
urls = ["https://www.melhorescartoes.com.br/c/promocoes-milhas/feed"]
