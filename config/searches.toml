# Datas: "AAAA-MM-DD". start_date também aceita "today".
# end_date também aceita "end_of_month" e "end_of_year".
# range_type: "single" (uma estadia) ou "weekly" (uma estadia por semana no período).

[settings]
output_dir = "output"
log_dir = "logs"
headless = true
concurrency = 4
timeout_seconds = 30
decolar_max_pages = 25

